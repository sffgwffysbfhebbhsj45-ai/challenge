<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك إلى الفيديو...</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        #counter {
            font-size: 48px;
            color: #e74c3c;
            font-weight: bold;
            margin: 20px 0;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        .ad-container {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>يرجى الانتظار قليلاً...</h2>
        <p>سيتم تحويلك إلى صفحة الفيديو خلال:</p>
        <div id="counter">10</div>

        <!-- مكان إعلان Adsterra البانر -->
        <div class="ad-container">
            <script type="text/javascript">
              atOptions = {
                'key' : '56eb40a5a259b80d56d406c82cd1855b',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script type="text/javascript" src="https://dcengg.org/22/56eb40a5a259b80d56d406c82cd1855b.js"></script>
        </div>

        <p>شكراً لتفهمك ودعمك المستمر!</p>
    </div>

    <script>
        // رابط الفيديو الخاص بك
        var targetUrl = "https://youtu.be/cu_YMPETww4?si=3L6qHftJDzFZ7VRr"; 

        var timeLeft = 10;
        var countdownElement = document.getElementById("counter");

        var downloadTimer = setInterval(function(){
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if(timeLeft <= 0){
                clearInterval(downloadTimer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
