<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك إلى حلقة التحدي...</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .timer {
            font-size: 24px;
            color: #4CAF50;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 جاري تجهيز حلقة التحدي...</h2>
        <p>يرجى الانتظار قليلاً بينما يتم تحميل المحتوى.</p>
        
        <!-- مكان الإعلان التجريبي المحترم -->
        <div style="background: #2c2c2c; padding: 15px; border-radius: 8px; border: 1px dashed #4CAF50; color: #fff; margin: 20px 0;">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #aaa;">إعلان تجريبي (راعي الصفحة)</p>
            <h3 style="margin: 0; color: #ffeb3b; font-size: 16px;">🎮 لعبة مغامرات الحصن الجديدة - العب الآن</h3>
        </div>

        <div class="timer">ستفتح الحلقة خلال: <span id="count">5</span> ثوانٍ</div>
    </div>

    <script>
        var seconds = 5;
        var countdown = setInterval(function() {
            seconds--;
            document.getElementById("count").textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "https://youtu.be/cu_YMPETww4?si=noMub9hmod5E96Lf";
            }
        }, 1000);
    </script>

</body>
</html>
